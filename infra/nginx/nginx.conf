# en-GB: Routes one allowlisted module to ASP.NET Core while preserving same-origin fallback to Express and Next.js.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format shiftflow escape=json
    '{"time":"$time_iso8601","requestId":"$request_id","remote":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time}';
  access_log /dev/stdout shiftflow;
  error_log /dev/stderr warn;
  server_tokens off;

  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  upstream shiftflow_web {
    server web:3000;
  }

  upstream shiftflow_legacy_api {
    server legacy-api:3001;
  }

  upstream shiftflow_dotnet_api {
    server api-dotnet:8080;
  }

  server {
    listen 8080;
    server_name localhost 127.0.0.1;
    client_max_body_size 1m;

    if ($host !~ ^(?:localhost|127[.]0[.]0[.]1)$) {
      return 421;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /edge-health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok","service":"shiftflow-nginx"}';
    }

    location = /api/audit {
      proxy_pass http://shiftflow_dotnet_api;
      include /etc/nginx/shiftflow-proxy.conf;
    }

    location ^~ /api/audit/ {
      proxy_pass http://shiftflow_dotnet_api;
      include /etc/nginx/shiftflow-proxy.conf;
    }

    location ^~ /openapi/ {
      proxy_pass http://shiftflow_dotnet_api;
      include /etc/nginx/shiftflow-proxy.conf;
    }

    location ^~ /api/ {
      proxy_pass http://shiftflow_legacy_api;
      include /etc/nginx/shiftflow-proxy.conf;
    }

    location = /health {
      proxy_pass http://shiftflow_legacy_api;
      include /etc/nginx/shiftflow-proxy.conf;
    }

    location = /ready {
      proxy_pass http://shiftflow_legacy_api;
      include /etc/nginx/shiftflow-proxy.conf;
    }

    location / {
      proxy_pass http://shiftflow_web;
      include /etc/nginx/shiftflow-proxy.conf;
    }
  }
}
