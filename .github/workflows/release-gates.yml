name: Release gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shiftflow
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci-postgres-password' }}
          POSTGRES_DB: shiftflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftflow -d shiftflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || format('postgresql://shiftflow:{0}@localhost:5432/shiftflow?schema=public', secrets.POSTGRES_PASSWORD || 'ci-postgres-password') }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL || 'integration.admin@shiftflow.local' }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'Integration#Password123' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-release-gates-jwt-secret-minimum-32-chars' }}
      API_PORT: 3001
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      PLAYWRIGHT_CHROME_EXECUTABLE_PATH: bundled

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Deploy approved migrations
        run: npx prisma migrate deploy

      - name: Seed integration data
        run: node prisma/integration-seed.mjs

      - name: Seed homologation data
        run: npm run homologation:seed

      - name: Audit dependencies
        run: npm run security:audit

      - name: Scan secrets
        run: npm run security:secrets

      - name: Validate production config
        run: npm run security:production-config

      - name: Quality gates
        run: npm run quality

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Playwright E2E
        run: npx playwright test

      - name: Load stress
        run: npm run test:load:stress
