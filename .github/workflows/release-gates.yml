# en-GB: Configures release gates automation so infrastructure and release behaviour remain reproducible.
name: Release gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-gate:
    name: Core gate (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout complete candidate history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Canonical core gate
        run: pwsh -NoProfile -File eng/ci.ps1 -Component Node -SkipInstall -BaseRef '${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}'

  dotnet-gate:
    name: ASP.NET Core gate (.NET 10)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout complete candidate history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Canonical ASP.NET Core gate
        run: pwsh -NoProfile -File eng/ci.ps1 -Component DotNet -BaseRef '${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}'

  oci-evidence-gate:
    name: OCI evidence (${{ matrix.id }})
    needs: [core-gate, dotnet-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: api-dotnet
            sourceKind: build
            dockerfile: apps/api-dotnet/Dockerfile
            target: runtime
          - id: legacy-api
            sourceKind: build
            dockerfile: infra/docker/node.Dockerfile
            target: legacy-api
          - id: migration
            sourceKind: build
            dockerfile: infra/docker/node.Dockerfile
            target: migration
          - id: nginx
            sourceKind: registry
            image: nginx:1.30.4-alpine-slim@sha256:77da26c31397bf6694b4bf93275f5b40b0b120ba1b8f114264b603e592c561d6
          - id: postgres
            sourceKind: build
            dockerfile: infra/docker/infrastructure.Dockerfile
            target: postgres
          - id: redis
            sourceKind: build
            dockerfile: infra/docker/infrastructure.Dockerfile
            target: redis
          - id: web
            sourceKind: build
            dockerfile: infra/docker/node.Dockerfile
            target: web

    steps:
      - name: Checkout complete candidate history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Record bounded evidence context
        id: evidence_context
        shell: bash
        env:
          EVIDENCE_TARGET: ${{ matrix.id }}
          EVIDENCE_SOURCE_KIND: ${{ matrix.sourceKind }}
          EVIDENCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const evidenceDirectory = path.join(process.env.RUNNER_TEMP, "oci-evidence");
          const context = {
            targetId: process.env.EVIDENCE_TARGET,
            sourceKind: process.env.EVIDENCE_SOURCE_KIND,
            testedCommit: process.env.GITHUB_SHA,
            pullRequestHead: process.env.EVIDENCE_PR_HEAD || null,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
          };
          fs.mkdirSync(evidenceDirectory, { recursive: true });
          fs.writeFileSync(path.join(evidenceDirectory, `${context.targetId}.context.json`), JSON.stringify(context, null, 2) + "\n");
          NODE

      - name: Setup Docker containerd image store
        id: setup_docker
        if: matrix.sourceKind == 'build'
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1
        with:
          version: v29.7.2
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }

      - name: Setup Docker Buildx
        id: setup_buildx
        if: matrix.sourceKind == 'build'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build local subject and capture Buildx metadata
        id: build_subject
        if: matrix.sourceKind == 'build'
        shell: bash
        env:
          BUILDX_METADATA_PROVENANCE: max
          BUILDX_GIT_CHECK_DIRTY: "1"
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_status="$(git --no-optional-locks status --porcelain=v1 --untracked-files=all --ignored)"
          test -z "$source_status"
          subject_ref="shiftflow-local/${{ matrix.id }}:${GITHUB_SHA}"
          docker buildx build \
            --file '${{ matrix.dockerfile }}' \
            --load \
            --metadata-file "$RUNNER_TEMP/oci-evidence/${{ matrix.id }}.provenance.json" \
            --platform linux/amd64 \
            --provenance=mode=max \
            --tag "$subject_ref" \
            --target '${{ matrix.target }}' \
            .
          echo "image_ref=$subject_ref" >> "$GITHUB_OUTPUT"

      - name: Select digest-pinned registry subject
        id: registry_subject
        if: matrix.sourceKind == 'registry'
        shell: bash
        run: echo 'image_ref=${{ matrix.image }}' >> "$GITHUB_OUTPUT"

      - name: Generate local SPDX evidence
        id: generate_sbom
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.74.0
          image-ref: ${{ steps.build_subject.outputs.image_ref || steps.registry_subject.outputs.image_ref }}
          scan-type: image
          scanners: vuln
          format: spdx-json
          output: ${{ runner.temp }}/oci-evidence/${{ matrix.id }}.spdx.json
          exit-code: "0"
          ignore-unfixed: "false"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          cache: "false"

      - name: Generate and enforce vulnerability evidence
        id: generate_scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.74.0
          image-ref: ${{ steps.build_subject.outputs.image_ref || steps.registry_subject.outputs.image_ref }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: json
          output: ${{ runner.temp }}/oci-evidence/${{ matrix.id }}.scan.json
          exit-code: "1"
          ignore-unfixed: "false"
          severity: UNKNOWN,MEDIUM,HIGH,CRITICAL
          skip-setup-trivy: "true"
          cache: "false"

      - name: Validate evidence bindings without publication
        id: validate_evidence
        shell: bash
        run: |
          arguments=(
            --targets eng/oci-targets.json
            --target-id '${{ matrix.id }}'
            --source-kind '${{ matrix.sourceKind }}'
            --subject-ref '${{ steps.build_subject.outputs.image_ref || steps.registry_subject.outputs.image_ref }}'
            --sbom "$RUNNER_TEMP/oci-evidence/${{ matrix.id }}.spdx.json"
            --scan "$RUNNER_TEMP/oci-evidence/${{ matrix.id }}.scan.json"
          )
          if [[ '${{ matrix.sourceKind }}' == 'build' ]]; then
            arguments+=(
              --source-commit "$GITHUB_SHA"
              --provenance "$RUNNER_TEMP/oci-evidence/${{ matrix.id }}.provenance.json"
            )
          fi
          node scripts/verify-oci-runtime-evidence.mjs "${arguments[@]}"

      - name: Record evidence outcomes and report presence
        if: always()
        shell: bash
        env:
          EVIDENCE_TARGET: ${{ matrix.id }}
          CONTEXT_OUTCOME: ${{ steps.evidence_context.outcome }}
          DOCKER_OUTCOME: ${{ steps.setup_docker.outcome }}
          BUILDX_OUTCOME: ${{ steps.setup_buildx.outcome }}
          BUILD_OUTCOME: ${{ steps.build_subject.outcome }}
          REGISTRY_OUTCOME: ${{ steps.registry_subject.outcome }}
          SBOM_OUTCOME: ${{ steps.generate_sbom.outcome }}
          SCAN_OUTCOME: ${{ steps.generate_scan.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate_evidence.outcome }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const evidenceDirectory = path.join(process.env.RUNNER_TEMP, "oci-evidence");
          const targetId = process.env.EVIDENCE_TARGET;
          const status = {
            targetId,
            testedCommit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            outcomes: {
              context: process.env.CONTEXT_OUTCOME,
              docker: process.env.DOCKER_OUTCOME,
              buildx: process.env.BUILDX_OUTCOME,
              build: process.env.BUILD_OUTCOME,
              registry: process.env.REGISTRY_OUTCOME,
              sbom: process.env.SBOM_OUTCOME,
              scan: process.env.SCAN_OUTCOME,
              validation: process.env.VALIDATION_OUTCOME,
            },
            reportsPresent: Object.fromEntries(
              ["context.json", "spdx.json", "scan.json", "provenance.json"].map(
                (suffix) => [suffix, fs.existsSync(path.join(evidenceDirectory, `${targetId}.${suffix}`))],
              ),
            ),
          };
          fs.mkdirSync(evidenceDirectory, { recursive: true });
          fs.writeFileSync(path.join(evidenceDirectory, `${targetId}.status.json`), JSON.stringify(status, null, 2) + "\n");
          NODE

      - name: Retain bounded OCI diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-evidence-${{ matrix.id }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/oci-evidence/${{ matrix.id }}.context.json
            ${{ runner.temp }}/oci-evidence/${{ matrix.id }}.status.json
            ${{ runner.temp }}/oci-evidence/${{ matrix.id }}.spdx.json
            ${{ runner.temp }}/oci-evidence/${{ matrix.id }}.scan.json
            ${{ runner.temp }}/oci-evidence/${{ matrix.id }}.provenance.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false

  runtime-gates:
    name: Disposable runtime gates (Node.js 22)
    needs: [core-gate, dotnet-gate, oci-evidence-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      DATABASE_URL: postgresql://shiftflow:ci-postgres-password@localhost:5432/shiftflow_ci?schema=public
      E2E_EMAIL: integration.admin@shiftflow.local
      API_PORT: 3001
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      PLAYWRIGHT_CHROME_EXECUTABLE_PATH: bundled

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Build job-owned PostgreSQL image
        id: runtime_postgres
        shell: bash
        run: |
          owner="shiftflow-ci-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_tag="shiftflow-ci/postgres:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          existing_containers="$(docker container ls --all --quiet --filter "name=^/${owner}$")"
          existing_volumes="$(docker volume ls --quiet --filter "name=^${owner}-data$")"
          existing_images="$(docker image ls --quiet "$image_tag")"
          test -z "$existing_containers$existing_volumes$existing_images"
          docker build --file infra/docker/infrastructure.Dockerfile --target postgres --tag "$image_tag" .
          image_id="$(docker image inspect --format '{{.Id}}' "$image_tag")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Enforce security of the actual PostgreSQL runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.74.0
          image-ref: ${{ steps.runtime_postgres.outputs.image_id }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: "1"
          ignore-unfixed: "false"
          severity: UNKNOWN,MEDIUM,HIGH,CRITICAL
          cache: "false"

      - name: Start scanned job-owned PostgreSQL
        id: start_runtime_postgres
        shell: bash
        env:
          POSTGRES_IMAGE_ID: ${{ steps.runtime_postgres.outputs.image_id }}
        run: |
          owner="shiftflow-ci-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$owner" =~ ^shiftflow-ci-postgres-[0-9]+-[0-9]+$ ]]
          [[ "$POSTGRES_IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$(docker image inspect --format '{{.Id}}' "$POSTGRES_IMAGE_ID")" = "$POSTGRES_IMAGE_ID"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          docker volume create --label "shiftflow.ci.owner=$owner" "${owner}-data"
          docker run --detach --pull never --name "$owner" --label "shiftflow.ci.owner=$owner" \
            --publish 127.0.0.1:5432:5432 --mount "type=volume,source=${owner}-data,target=/var/lib/postgresql/data" \
            --env POSTGRES_USER=shiftflow --env POSTGRES_PASSWORD=ci-postgres-password --env POSTGRES_DB=shiftflow_ci \
            --health-cmd 'pg_isready -U shiftflow -d shiftflow_ci' --health-interval 2s --health-timeout 5s --health-retries 30 \
            "$POSTGRES_IMAGE_ID"
          test "$(docker inspect --format '{{.Image}}' "$owner")" = "$POSTGRES_IMAGE_ID"
          for attempt in $(seq 1 30); do
            test "$(docker inspect --format '{{.State.Status}}' "$owner")" = running
            if test "$(docker inspect --format '{{.State.Health.Status}}' "$owner")" = healthy; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Generate ephemeral runtime credentials
        shell: pwsh
        run: |
          $nonce = [System.Convert]::ToHexString(
            [System.Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          $e2ePassword = "Ci!aA1-$nonce"
          $jwtSecret = [System.Convert]::ToBase64String(
            [System.Security.Cryptography.RandomNumberGenerator]::GetBytes(48))
          Write-Output "::add-mask::$e2ePassword"
          Write-Output "::add-mask::$jwtSecret"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "E2E_PASSWORD=$e2ePassword"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "JWT_SECRET=$jwtSecret"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Deploy approved migrations to disposable CI database
        run: npx prisma migrate deploy

      - name: Validate transactional aggregates against disposable PostgreSQL
        env:
          SHIFTFLOW_POSTGRES_INTEGRATION: "1"
        run: npm run test:postgres:integration

      - name: Seed integration data
        run: node prisma/integration-seed.mjs

      - name: Seed homologation data
        run: npm run homologation:seed

      - name: Playwright E2E
        run: npx playwright test

      - name: Load stress
        run: npm run test:load:stress

      - name: Remove only job-owned PostgreSQL resources
        if: always()
        shell: bash
        env:
          POSTGRES_RESOURCE_OWNER: ${{ steps.start_runtime_postgres.outputs.owner }}
        run: |
          if test -z "$POSTGRES_RESOURCE_OWNER"; then exit 0; fi
          owner="shiftflow-ci-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$POSTGRES_RESOURCE_OWNER" = "$owner"
          container_id="$(docker container ls --all --quiet --filter "name=^/${owner}$")"
          if test -n "$container_id"; then
            test "$(docker inspect --format '{{index .Config.Labels "shiftflow.ci.owner"}}' "$container_id")" = "$owner"
            docker container rm --force "$container_id"
          fi
          volume_name="$(docker volume ls --quiet --filter "name=^${owner}-data$")"
          if test -n "$volume_name"; then
            test "$volume_name" = "${owner}-data"
            test "$(docker volume inspect --format '{{index .Labels "shiftflow.ci.owner"}}' "$volume_name")" = "$owner"
            docker volume rm "$volume_name"
          fi
          remaining_containers="$(docker container ls --all --quiet --filter "name=^/${owner}$")"
          remaining_volumes="$(docker volume ls --quiet --filter "name=^${owner}-data$")"
          test -z "$remaining_containers$remaining_volumes"

  strangler-runtime-gate:
    name: ASP.NET Core strangler runtime gate
    needs: runtime-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run canonical disposable strangler gate
        shell: pwsh
        run: pwsh -NoProfile -File eng/strangler-runtime.ps1 -ProjectName shiftflow-strangler-ci
