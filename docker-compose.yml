# en-GB: Configures docker compose automation so infrastructure and release behaviour remain reproducible.
services:
  postgres:
    build:
      context: .
      dockerfile: infra/docker/infrastructure.Dockerfile
      target: postgres
    # Development-only credentials. Production must use managed secrets and a non-public database endpoint.
    environment:
      POSTGRES_USER: shiftflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Copy .env.example to .env or export it before running docker compose.}
      POSTGRES_DB: shiftflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftflow -d shiftflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data
      - local-access

  redis:
    build:
      context: .
      dockerfile: infra/docker/infrastructure.Dockerfile
      target: redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data
      - local-access

  migrate:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://shiftflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required.}@postgres:5432/shiftflow?schema=public
      SHIFTFLOW_DISPOSABLE_RUNTIME: CONFIRMED_DISPOSABLE_STRANGLER
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  legacy-api:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      target: legacy-api
    environment:
      API_INSTANCE_COUNT: 1
      API_PORT: 3001
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: postgresql://shiftflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required.}@postgres:5432/shiftflow?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required.}
      JWT_ISSUER: ${JWT_ISSUER:-shiftflow}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required.}
      LOG_LEVEL: info
      NODE_ENV: production
      RATE_LIMIT_STORE: memory
      REQUIRE_ORIGIN_ON_UNSAFE_REQUESTS: "true"
      TRUST_PROXY: 172.31.238.10
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - data

  api-dotnet:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: apps/api-dotnet/Dockerfile
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      API_RATE_LIMIT_WINDOW_MS: "600000"
      DATABASE_URL: postgresql://shiftflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required.}@postgres:5432/shiftflow?schema=public
      DATA_PROTECTION_KEYS_PATH: /var/lib/shiftflow/keys
      ENABLE_INTERNAL_RUNTIME_PROBES: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required.}
      JWT_ISSUER: ${JWT_ISSUER:-shiftflow}
      REDIS_CONNECTION: redis:6379,abortConnect=false
      REDIS_INSTANCE_NAME: "shiftflow:local:"
      TRUSTED_PROXY_IPS: 172.31.238.10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - data-protection-keys:/var/lib/shiftflow/keys
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - data

  web:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_ALLOW_INSECURE_LOOPBACK: "true"
    environment:
      NODE_ENV: production
    depends_on:
      legacy-api:
        condition: service_healthy
      api-dotnet:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edge

  nginx:
    profiles: ["migration"]
    image: nginx:1.30.4-alpine-slim@sha256:77da26c31397bf6694b4bf93275f5b40b0b120ba1b8f114264b603e592c561d6
    user: "101:101"
    read_only: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/shiftflow-proxy.conf:/etc/nginx/shiftflow-proxy.conf:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    depends_on:
      legacy-api:
        condition: service_healthy
      api-dotnet:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:8080/edge-health >/dev/null &&
          wget -qO- http://legacy-api:3001/ready >/dev/null &&
          wget -qO- http://api-dotnet:8080/ready >/dev/null &&
          wget -qO- http://web:3000/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      edge:
        ipv4_address: 172.31.238.10

volumes:
  postgres-data:
  redis-data:
  data-protection-keys:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.238.0/24
  data:
    internal: true
  local-access:
    internal: false
