services:
  postgres:
    image: postgres:16-alpine
    container_name: shiftflow-postgres
    environment:
      POSTGRES_USER: shiftflow
      POSTGRES_PASSWORD: shiftflow
      POSTGRES_DB: shiftflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftflow -d shiftflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
